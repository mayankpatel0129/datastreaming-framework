# Distributed Mode Configuration for Data Streaming Framework
# This configuration enables Redis-based distributed tracking across multiple instances

spring:
  application:
    name: sample-streaming-app-distributed
  profiles:
    active: distributed

# Data Streaming Framework Configuration for Distributed Mode
datastreaming:
  enabled: true
  
  # Instance identification
  instance:
    id: "${HOSTNAME:-streaming-app-001}"
    zone: "${DEPLOYMENT_ZONE:-us-west-2a}"
    environment: "${ENVIRONMENT:-production}"
    labels:
      team: "data-platform"
      version: "1.0.0"
      deployment: "distributed"
  
  # MQ Sources Configuration
  sources:
    # Financial Transactions Source
    - name: "financial-transactions"
      queueManagerName: "PROD_QM_FINANCE"
      hostname: "mq-finance.company.com"
      port: 1414
      channel: "SYSTEM.DEF.SVRCONN"
      queueName: "FINANCE.TRANSACTION.QUEUE"
      userId: "${MQ_FINANCE_USER:admin}"
      password: "${MQ_FINANCE_PASSWORD:password}"
      sourceContract: "transaction-mq-v1"
      targetTopic: "financial-transactions"
      targetContract: "transaction-avro-v1"
      consumerThreads: 15
      maxBatchSize: 1000
      enabled: true
      additionalProperties:
        XMSC_WMQ_CLIENT_RECONNECT_OPTIONS: "67108864"
    
    # Payment Processing Source  
    - name: "payment-processing"
      queueManagerName: "PROD_QM_PAYMENTS"
      hostname: "mq-payments.company.com" 
      port: 1414
      channel: "SYSTEM.DEF.SVRCONN"
      queueName: "PAYMENTS.INPUT.QUEUE"
      userId: "${MQ_PAYMENTS_USER:admin}"
      password: "${MQ_PAYMENTS_PASSWORD:password}"
      sourceContract: "payment-mq-v1"
      targetTopic: "payment-events"
      targetContract: "payment-avro-v1"
      consumerThreads: 12
      maxBatchSize: 800
      enabled: true

  # Kafka Configuration
  kafka:
    bootstrapServers: "kafka-prod-01:9092,kafka-prod-02:9092,kafka-prod-03:9092"
    securityProtocol: "SASL_SSL"
    saslMechanism: "PLAIN" 
    saslJaasConfig: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"${KAFKA_USERNAME}\" password=\"${KAFKA_PASSWORD}\";"
    schemaRegistryUrl: "https://schema-registry.company.com"
    schemaRegistryCredentials: "${SCHEMA_REGISTRY_CREDENTIALS}"
    batchSize: 131072
    lingerMs: 5
    bufferMemory: 268435456
    compressionType: "lz4"
    maxInFlightRequestsPerConnection: 5
    enableIdempotence: true
    additionalProperties:
      ssl.truststore.location: "/opt/app/certs/kafka.truststore.jks"
      ssl.truststore.password: "${TRUSTSTORE_PASSWORD}"

  # Distributed Reconciliation Configuration
  reconciliation:
    enabled: true
    mode: "distributed"                   # Enable distributed tracking
    reconciliationIntervalMs: 15000       # Check every 15 seconds
    maxRetryAttempts: 5                   # More retries for production
    retryBackoffMs: 3000                  # Faster retries
    enableDeadLetterQueue: true
    deadLetterTopic: "streaming-dlq"
    ttlHours: 24                          # Keep tracking data for 24 hours
    
    # Distributed storage configuration
    distributed:
      storageType: "redis"
      connectionString: "${REDIS_URL:redis://redis-cluster:6379}"
      keyPrefix: "streaming:"
      enableLeaderElection: true
      heartbeatIntervalMs: 30000
      maxConnectionRetries: 3
      connectionTimeoutMs: 5000
      
      # Redis cluster configuration
      redis:
        host: "${REDIS_HOST:redis-cluster.company.com}"
        port: ${REDIS_PORT:6379}
        password: "${REDIS_PASSWORD}"
        database: ${REDIS_DATABASE:0}
        maxConnections: 50                # Higher connection pool for production
        maxIdleConnections: 10
        maxWaitMs: 2000
        enableSsl: ${REDIS_SSL_ENABLED:true}

  # Performance Tuning for Distributed Mode
  performance:
    globalThreadPoolSize: 100             # Higher thread pool for distributed processing
    queueCapacity: 50000                  # Larger queue capacity
    keepAliveTimeMs: 300000
    enableBackpressure: true
    backpressureThreshold: 40000          # Higher threshold for distributed

  # Enhanced Monitoring Configuration
  monitoring:
    metricsEnabled: true
    healthChecksEnabled: true
    metricsPrefix: "datastreaming_distributed"
    metricsIntervalMs: 15000              # More frequent metrics collection

  # Security Configuration
  security:
    enableSsl: true
    keystorePath: "/opt/app/certs/keystore.jks"
    keystorePassword: "${KEYSTORE_PASSWORD}"
    truststorePath: "/opt/app/certs/truststore.jks" 
    truststorePassword: "${TRUSTSTORE_PASSWORD}"

  # Contract Management
  contracts:
    type: "schema-registry"               # Use schema registry for distributed mode
    schemaRegistryUrl: "https://schema-registry.company.com"
    schemaRegistryCredentials: "${SCHEMA_REGISTRY_CREDENTIALS}"
    autoReload: true
    reloadIntervalMs: 300000

# Application Configuration
server:
  port: 8080
  shutdown: graceful

# Spring Boot Configuration
spring:
  application:
    name: sample-streaming-app-distributed
  data:
    redis:
      url: "${REDIS_URL:redis://redis-cluster:6379}"
      password: "${REDIS_PASSWORD}"
      ssl: ${REDIS_SSL_ENABLED:true}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 10
          min-idle: 2
          max-wait: 2000ms

# Enhanced Actuator Configuration for Distributed Mode
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info,env,configprops
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    diskspace:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5, 0.95, 0.99
      sla:
        "[http.server.requests]": 100ms, 500ms, 1000ms

# Logging Configuration for Distributed Mode
logging:
  level:
    com.datastreaming.framework: INFO
    com.datastreaming.framework.core.tracking: DEBUG
    com.datastreaming.framework.core.metrics: DEBUG
    com.datastreaming.framework.core.health: DEBUG
    com.datastreaming.sample: INFO
    org.apache.kafka: WARN
    io.lettuce.core: WARN
    org.springframework.data.redis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] [${HOSTNAME:unknown}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] [${HOSTNAME:unknown}] %logger{36} - %msg%n"
  file:
    name: "/var/log/streaming-app/application.log"

---
# Development Profile for Distributed Mode Testing
spring:
  config:
    activate:
      on-profile: dev-distributed

datastreaming:
  instance:
    id: "${HOSTNAME:-dev-streaming-app-001}"
    zone: "local"
    environment: "development"
    
  sources:
    - name: "dev-transactions"
      queueManagerName: "DEV_QM"
      hostname: "localhost"
      port: 1414
      channel: "DEV.ADMIN.SVRCONN"
      queueName: "DEV.TRANSACTION.QUEUE"
      userId: "admin"
      password: "passw0rd"
      sourceContract: "transaction-mq-v1"
      targetTopic: "dev-transactions"
      targetContract: "transaction-avro-v1"
      consumerThreads: 3
      maxBatchSize: 100
      enabled: true

  kafka:
    bootstrapServers: "localhost:9092"
    securityProtocol: "PLAINTEXT"
    schemaRegistryUrl: "http://localhost:8081"
    batchSize: 16384
    compressionType: "none"

  reconciliation:
    distributed:
      redis:
        host: "localhost"
        port: 6379
        password: ""
        enableSsl: false

  security:
    enableSsl: false

spring:
  data:
    redis:
      url: "redis://localhost:6379"
      password: ""
      ssl: false

logging:
  level:
    com.datastreaming.framework: DEBUG
    root: INFO

---
# Docker Profile for Container Deployments
spring:
  config:
    activate:
      on-profile: docker

datastreaming:
  reconciliation:
    distributed:
      redis:
        host: "redis"
        port: 6379

spring:
  data:
    redis:
      url: "redis://redis:6379"
      
---
# Kubernetes Profile for K8s Deployments  
spring:
  config:
    activate:
      on-profile: kubernetes

datastreaming:
  instance:
    id: "${HOSTNAME}"
    zone: "${KUBE_NODE_NAME:unknown}"
    
  reconciliation:
    distributed:
      redis:
        host: "${REDIS_SERVICE_HOST:redis-cluster}"
        port: ${REDIS_SERVICE_PORT:6379}

spring:
  data:
    redis:
      url: "redis://${REDIS_SERVICE_HOST:redis-cluster}:${REDIS_SERVICE_PORT:6379}"

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true